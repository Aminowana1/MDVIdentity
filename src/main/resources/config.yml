# ==========================================================
# MDVIdentity 1.0.5 - MDVCRAFT
# ==========================================================
# Objetivo:
# - Un nombre puede pertenecer a JAVA o BEDROCK, nunca a ambos.
# - El primero que queda registrado gana el nombre.
# - Bedrock se registra automaticamente usando identidad Floodgate/Xbox.
# - Java offline reserva el nombre al completar /register de nLogin.
# - Java premium reserva el nombre al autenticarse correctamente con nLogin.
# - Los nombres se comparan sin distinguir mayusculas/minusculas.
#
# IMPORTANTE PARA QUITAR EL PREFIJO BEDROCK:
# 1) En plugins/floodgate/config.yml usa:
#      username-prefix: ""
# 2) OBLIGATORIO: en la config premium de nLogin deja SU autologin Bedrock desactivado:
#      autologin:
#        bedrock:
#          enable: false
#    Si lo dejas en true, nLogin intenta su propio flujo con prefijo vacio y puede abrir
#    el formulario de contraseña antes de que MDVIdentity termine el puente.
#    MDVIdentity hara el registro + forceLogin mediante la API de nLogin.
#
# NOTA nLogin 2.0.19:
# Con username-prefix: "" nLogin crea internamente el LoginRequest Bedrock como OFFLINE.
# MDVIdentity lo contempla: Floodgate/identities.db siguen diciendo BEDROCK, y la identidad
# OFFLINE de nLogin se usa SOLO como capa interna para desbloquear su limbo.
#
# Tu prefijo antiguo era "_". Solo se elimina al importar CUENTAS BEDROCK
# detectadas por su bedrock_id en nLogin. Nunca se elimina de jugadores Java.

storage:
  file: identities.db

migration:
  import-existing-nlogin-on-first-start: false
  legacy-bedrock-prefix: "_"
  write-conflicts-yml: true
  # Repara automaticamente cuentas Bedrock antiguas que nLogin guardo sin prefijo
  # como si fueran Java, SOLO cuando puede demostrar que comparten la misma identidad.
  repair-verified-legacy-bedrock-aliases: false

bedrock-auth:
  enabled: true
  # 0 = intentar forceLogin en el mismo PlayerJoinEvent para que nLogin no alcance a
  # abrir el formulario de contraseña de Bedrock.
  delay-ticks: 0
  retry-delay-ticks: 1
  # 120 intentos * 1 tick = hasta ~6 s. Normalmente autentica en 0-2 ticks.
  max-attempts: 120
  log-success: true
  # Si forceLogin llega antes de que nLogin cree su login request, solicita una request
  # con la misma identidad OFFLINE que nLogin usa internamente con prefijo vacio.
  request-login-if-needed: true
  # Si finalmente falla, imprime IDs/tipo de cuenta de nLogin para diagnosticar sin adivinar.
  log-diagnostics-on-failure: true
  # Password interno aleatorio para una cuenta Bedrock nueva en nLogin.
  # El jugador Bedrock nunca necesita conocerlo.
  internal-password-length: 24

security:
  # Si MDVIdentity aun no termino de cargar/importar, no deja entrar a nadie.
  deny-logins-until-ready: true
  # Si el mismo nombre BEDROCK aparece con otro UUID/XUID, se considera otra cuenta.
  strict-bedrock-owner-check: true

  # Si una DB vieja dice JAVA pero Floodgate+nLogin demuestran que ese UUID pertenece
  # al mismo jugador Bedrock actual, corrige JAVA -> BEDROCK en caliente. Nunca repara
  # por nombre solamente.
  runtime-repair-verified-bedrock: true

messages:
  prefix: '&6&l[&5&lMDVCRAFT&6&l]  &4»  '
  starting: '&eEl sistema de identidad se esta iniciando. Intenta entrar de nuevo en unos segundos.'
  java-name-owned-by-bedrock: '&cEl nombre &f{name} &cya pertenece a un jugador de Bedrock en MDVCRAFT.'
  bedrock-name-owned-by-java: '&cEl nombre &f{name} &cya pertenece a un jugador de Java en MDVCRAFT.'
  bedrock-name-owned-by-other-xbox: '&cEl nombre &f{name} &cya pertenece a otra cuenta de Bedrock/Xbox.'
  bedrock-auth-failed: '&cNo se pudo completar tu autenticacion Bedrock. Intenta entrar de nuevo.'
  registration-conflict: '&cEse nombre acaba de ser reservado por otra plataforma y no puede registrarse.'
