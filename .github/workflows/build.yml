name: Build MDVIdentity

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -U clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MDVIdentity-1.0.4
          path: target/MDVIdentity-1.0.4.jar
          if-no-files-found: error
          retention-days: 3
